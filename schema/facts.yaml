# L3 canonical facts schema (Gate 4, ADR-009).
# The vocabulary is the UNION of the fact names used by the frozen golden
# set oracle/golden/S01-S14 (the scenarios DEFINE the vocabulary), plus the
# chapter-III-obligations fact HR_ANNEX_III needs to fail closed (Phase E).
# Italian is first-class, plain SME language (no legalese). The
# questionnaire is generated FROM this schema; no free-text fact enters
# the engine (ADR-003). The synthetic schema moved to
# tests/fixtures/facts_synthetic.yaml.
facts:
  # --- material / territorial scope (Art. 2) ---
  - name: is_ai_system
    type: bool
    i18n:
      it: "Lo strumento che stai valutando è un sistema di intelligenza artificiale? (Contano anche i sistemi basati su regole o conoscenza codificata che ne deducono un risultato, non i semplici automatismi a regole fisse.)"
      en: "Is the tool you are checking an artificial intelligence system? (Rule-based and knowledge-based systems that infer a result count too, not simple fixed-rule automation.)"
  - name: in_eu_market
    type: bool
    i18n:
      it: "Il sistema è immesso sul mercato UE, messo in servizio o utilizzato nell'Unione?"
      en: "Is the system placed on the EU market, put into service, or used in the Union?"
  - name: personal_nonprofessional_use
    type: bool
    i18n:
      it: "È usato da una persona fisica per un'attività puramente personale e non professionale?"
      en: "Is it used by a natural person in a purely personal, non-professional activity?"
  - name: operator_role
    type: enum
    values: [provider, deployer]
    i18n:
      it: "Che ruolo hai rispetto a questo strumento: fornitore (lo sviluppi o lo metti sul mercato a tuo nome) o utilizzatore (lo usi nella tua attività)?"
      en: "What is your role for this tool: provider (you develop it or place it on the market under your name) or deployer (you use it in your business)?"

  # --- Art. 50 transparency ---
  - name: interacts_with_persons
    type: bool
    i18n:
      it: "Il sistema è destinato a interagire direttamente con le persone fisiche?"
      en: "Is the system intended to interact directly with natural persons?"
  - name: interaction_disclosed
    type: bool
    i18n:
      it: "Le persone sono informate che stanno interagendo con un sistema di IA?"
      en: "Are the persons concerned informed that they are interacting with an AI system?"
  - name: deepfake_published
    type: bool
    # Art. 50(4) triggers on a deployer's system that GENERATES or manipulates
    # deep-fake content, not on publication alone - the question captures that
    # (hunt F2). 'false' means the system does not produce deep fakes at all.
    i18n:
      it: "Il sistema genera o manipola deepfake (immagini, audio o video artificiali)?"
      en: "Does the system generate or manipulate deep fakes (artificial image, audio or video)?"
  - name: deepfake_disclosed
    type: bool
    i18n:
      it: "Viene dichiarato che il contenuto è stato generato o manipolato artificialmente?"
      en: "Is it disclosed that the content has been artificially generated or manipulated?"
  - name: generates_synthetic_content
    type: bool
    i18n:
      it: "Il sistema genera contenuti sintetici (audio, immagini, video o testo)?"
      en: "Does the system generate synthetic content (audio, image, video or text)?"
  - name: content_marked_machine_readable
    type: bool
    i18n:
      it: "I contenuti sintetici sono marcati in un formato leggibile meccanicamente?"
      en: "Is the synthetic output marked in a machine-readable format and detectable as artificially generated or manipulated?"
  - name: system_on_market_before_2026_08_02
    type: bool
    i18n:
      it: "Il sistema era già stato immesso sul mercato prima del 2 agosto 2026?"
      en: "Was the system already placed on the market before 2 August 2026?"

  # --- Art. 5 prohibited practices ---
  - name: practice_social_scoring
    type: bool
    i18n:
      it: "Il sistema valuta o classifica le persone in base al comportamento sociale o a caratteristiche personali, con un punteggio che porta a un trattamento sfavorevole in contesti non collegati o a un trattamento ingiustificato o sproporzionato (punteggio sociale)?"
      en: "Does the system evaluate or classify people based on social behaviour or personal characteristics, with the score leading to unfavourable treatment in unrelated contexts or to disproportionate treatment (social scoring)?"
  - name: emotion_recognition_workplace
    type: bool
    i18n:
      it: "Il sistema inferisce (deduce) le emozioni delle persone sul luogo di lavoro o negli istituti di istruzione?"
      en: "Does the system infer people's emotions in the workplace or in education institutions?"
  - name: emotion_medical_safety_exception
    type: bool
    i18n:
      it: "Il riconoscimento delle emozioni è previsto per motivi medici o di sicurezza?"
      en: "Is the emotion recognition intended for medical or safety reasons?"
  - name: ncii_generation_capability
    type: bool
    i18n:
      it: "Il sistema può generare o manipolare materiale intimo non consensuale (immagini, video o audio - NCII)?"
      en: "Can the system generate or manipulate non-consensual intimate material (images, video or audio - NCII)?"
  - name: ncii_safeguards_state_of_art
    type: bool
    i18n:
      it: "Sono presenti salvaguardie tecniche allo stato dell'arte contro tale utilizzo?"
      en: "Are state-of-the-art technical safeguards in place against such use?"
  - name: ncii_intended_purpose
    type: bool
    # Art. 5(1a)(a)(i): if generating/manipulating NCII is the system's
    # intended purpose it is prohibited regardless of safeguards (hunt F3).
    i18n:
      it: "Generare o manipolare NCII è la finalità prevista del sistema?"
      en: "Is generating or manipulating NCII the system's intended purpose?"

  # --- Annex III high-risk (Chapter III) ---
  - name: annex_iii_use_case
    type: enum
    values:
      [none, employment_recruitment, education, critical_infrastructure,
       credit_scoring, law_enforcement]
    i18n:
      it: "Il sistema rientra in un caso d'uso ad alto rischio dell'allegato III? Quale?"
      en: "Does the system fall under an Annex III high-risk use case? Which one?"
  - name: chapter_iii_obligations_met
    type: bool
    i18n:
      it: "Per un uso ad alto rischio: gli obblighi del capo III sono già stati soddisfatti?"
      en: "For a high-risk use: have the Chapter III obligations already been met?"
