#
# GitHub Pages deploy (ADR-015(4)): serves web/ VERBATIM - no build step, the
# deployed files are the audited source. The live site's BUNDLE.sha256 must
# equal the repo's frozen value (human checklist / post-deploy verification).
name: pages
on:
  # Gated on CI: a push whose zero-exfiltration e2e FAILS must never reach the
  # live site (audit finding 2026-07-29 - the two workflows used to run
  # independently, so a red gate could still deploy).
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
