#
# Gate-7 regression gate (ADR-015). Every push/PR: the full deterministic gate
# (check.sh = tests + trace + oracle + web bundle) AND the Playwright e2e incl.
# the zero-exfiltration network assertion and a mobile viewport. Playwright is
# installed HERE ONLY (never locally); CI=1 forbids the local skip, so the
# privacy guarantee is regression-protected, not point-in-time.
name: ci
on:
  push:
  pull_request:
  # ADR-015a: calendar-driven behaviour (rules entering into force, runner
  # image and dependency drift) must surface WITHOUT a push. Mondays 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

jobs:
  gate:
    # ADR-015a: explicit image (never 'latest') and Node-24 action majors
    # (Node 20 leaves the runners on 2026-09-23); deps pinned in one file.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps (Playwright in CI ONLY, pinned in requirements-ci.txt)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
          python -m playwright install --with-deps chromium
      - name: Deterministic gate (check.sh)
        run: bash scripts/check.sh
      - name: e2e - zero-exfiltration + mobile (CI-enforced)
        run: |
          python scripts/serve_web.py 8000 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/index.html >/dev/null && break
            sleep 1
          done
          CI=1 BASE_URL=http://127.0.0.1:8000 python -m pytest -q tests_e2e/
