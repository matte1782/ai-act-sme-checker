smc_definition:
  referenced_by: >-
    new Art. 3 point (14b) of Regulation (EU) 2024/1689 as amended
    (ST 9247/26 ANNEX I, doc page 28)
  instrument: >-
    Commission Recommendation (EU) 2025/1099 of 21 May 2025,
    point (2) of the Annex
  celex: "32025H1099"
  thresholds_source_verified:
    staff: fewer than 750 persons
    turnover: annual turnover not exceeding EUR 150 million, or
    balance_sheet: annual balance sheet total not exceeding EUR 129 million
  e_table_refuted: >-
    E-table attributed '<=1500 staff, <=EUR 300M turnover, <=EUR 150M
    balance' to 2025/1099; the fetched source text says <750 staff,
    <=EUR 150M turnover or <=EUR 129M balance. Owner ruling 2026-07-14:
    record source values, keep this refutation note.
  caution: >-
    recital (4) of ST 9247/26 cites 'Recommendation 2025/3500/EC' while
    operative Art. 3(14b) cites (EU) 2025/1099; the operative provision
    controls. Re-check the reference on the OJ-published omnibus text.

