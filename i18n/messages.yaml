  # --- UX pass post-pilota (2026-08-27; findings P-pilota-async + A1) -------
  # Helper in linguaggio piano per le domande gergali, etichette umane per le
  # opzioni enum, etichette umane per le scadenze, nota sul salvataggio PDF.
  # Chiavi AGGIUNTIVE rispetto a REQUIRED_UI: il loader le valida (it+en non
  # vuoti) ma l'engine non le richiede; il web le usa se presenti.
  web_help_label:
    it: "Cosa significa questa domanda?"
    en: "What does this question mean?"
  help_is_ai_system:
    it: "Per la legge (art. 3, punto 1) un sistema di IA è un software che, dai dati che riceve, deduce come produrre risultati: previsioni, contenuti, raccomandazioni o decisioni. Esempi: un chatbot sul sito, un generatore di testi o immagini, un software che seleziona CV o valuta clienti. Contano anche i sistemi basati su regole o su conoscenza codificata che da quelle deducono un risultato, non solo quelli che apprendono dai dati: la definizione li comprende (art. 3, punto 1, con il considerando 12 e le linee guida della Commissione), e questo stesso strumento è un sistema di IA in quel senso. Non contano i programmi che si limitano a eseguire automaticamente operazioni secondo regole fissate da persone, senza dedurre nulla: un foglio di calcolo che fa somme, per esempio. Se non sei sicuro, «Non so» è una risposta legittima."
    en: "Under the law (Art. 3, point 1) an AI system is software that infers, from the input it receives, how to produce outputs: predictions, content, recommendations or decisions. Examples: a website chatbot, a text or image generator, software that screens CVs or scores customers. Rule-based and knowledge-based systems that infer a result from those rules count too, not only systems that learn from data: the definition covers them (Art. 3, point 1, with Recital 12 and the Commission's guidelines), and this very tool is an AI system in that sense. Programs that merely execute operations automatically under rules fixed by people, inferring nothing, do not count: a spreadsheet adding up numbers, for example. If unsure, 'I don't know' is a legitimate answer."
  help_in_eu_market:
    it: "«Immesso sul mercato» significa reso disponibile nell'Unione europea (art. 3, punti 9-11); l'ambito della legge copre anche la messa in servizio e l'uso da parte di chi opera nella UE (art. 2). In pratica: se l'azienda opera nella UE o serve clienti nella UE, rispondi «Sì»; se il caso è dubbio, «Non so» è la risposta onesta."
    en: "'Placed on the market' means made available in the European Union (Art. 3, points 9-11); the law's scope also covers putting into service and use by operators in the EU (Art. 2). In practice: if the company operates in the EU or serves EU customers, answer 'Yes'; if the case is unclear, 'I don't know' is the honest answer."
  help_operator_role:
    it: "«Fornitore»: sviluppi il sistema (o lo fai sviluppare) e lo metti sul mercato con il tuo nome. «Utilizzatore»: usi nella tua attività un sistema fornito da altri. La maggior parte delle PMI che usa strumenti acquistati o in abbonamento è un utilizzatore. Attenzione: se sviluppi il sistema, o lo fai sviluppare, e lo metti sul mercato con il tuo nome o marchio, sei un fornitore (art. 3, punto 3); se metti il tuo nome o marchio su un sistema ad alto rischio già sul mercato, la legge ti tratta come fornitore (art. 25, paragrafo 1, lettera a)."
    en: "'Provider': you develop the system (or have it developed) and place it on the market under your own name. 'Deployer': you use a system supplied by others in your business. Most SMEs using purchased or subscription tools are deployers. Note: if you develop the system, or have it developed, and place it on the market under your own name or trademark, you are a provider (Art. 3, point 3); if you put your name or trademark on a high-risk system already on the market, the law treats you as a provider (Art. 25(1)(a))."
  help_annex_iii_use_case:
    it: "L'allegato III è l'elenco, scritto nella legge, degli usi considerati ad alto rischio: per esempio la selezione del personale o l'accesso al credito. Qui ne trovi cinque; l'allegato ne elenca altri (per esempio identificazione biometrica, migrazione e frontiere, giustizia). Scegli l'ambito in cui il sistema viene usato. Se il tuo uso rientra in un ambito ad alto rischio che non è in elenco, o non sei sicuro, rispondi «Non so»: «Nessuno di questi» va scelto solo se il sistema non è usato in nessun ambito dell'allegato III."
    en: "Annex III is the list, written in the law, of the uses treated as high-risk: for example recruitment or access to credit. Five of them are listed here; the Annex has more (for example biometric identification, migration and borders, justice). Pick the area the system is used in. If your use falls under a high-risk area that is not listed, or you are unsure, answer 'I don't know': 'None of these' is only for a system used in none of the Annex III areas."
  help_chapter_iii_obligations_met:
    it: "Il capo III è la parte della legge sui sistemi ad alto rischio: requisiti del sistema (gestione dei rischi, qualità dei dati, documentazione tecnica, registrazione degli eventi, trasparenza, sorveglianza umana, accuratezza e sicurezza, artt. 8-15) più gli obblighi che dipendono dal ruolo, per fornitori e utilizzatori (artt. 16-27). Se non sai se sono stati soddisfatti, la risposta onesta è «Non so»."
    en: "Chapter III is the part of the law on high-risk systems: system requirements (risk management, data quality, technical documentation, logging, transparency, human oversight, accuracy and security, Arts. 8-15) plus the role-dependent obligations for providers and deployers (Arts. 16-27). If you don't know whether they are met, the honest answer is 'I don't know'."
  opt_operator_role_provider:
    it: "Fornitore (sviluppo o vendo il sistema)"
    en: "Provider (I develop or sell the system)"
  opt_operator_role_deployer:
    it: "Utilizzatore (uso un sistema fornito da altri)"
    en: "Deployer (I use a system supplied by others)"
  opt_annex_iii_use_case_none:
    it: "Nessuno di questi"
    en: "None of these"
  opt_annex_iii_use_case_employment_recruitment:
    it: "Lavoro e selezione del personale"
    en: "Employment and recruitment"
  opt_annex_iii_use_case_education:
    it: "Istruzione e formazione"
    en: "Education and training"
  opt_annex_iii_use_case_critical_infrastructure:
    it: "Infrastrutture critiche"
    en: "Critical infrastructure"
  opt_annex_iii_use_case_credit_scoring:
    it: "Accesso al credito (credit scoring)"
    en: "Access to credit (credit scoring)"
  opt_annex_iii_use_case_law_enforcement:
    it: "Attività di contrasto (forze dell'ordine)"
    en: "Law enforcement"
  deadline_HR_ANNEX_III:
    it: "Obblighi per i sistemi ad alto rischio (allegato III)"
    en: "Obligations for high-risk systems (Annex III)"
  deadline_ART50_1:
    it: "Dire alle persone che stanno interagendo con un'IA (es. chatbot)"
    en: "Telling people they are interacting with an AI (e.g. chatbot)"
  deadline_ART50_2:
    it: "Marcare i contenuti generati dall'IA come artificiali"
    en: "Marking AI-generated content as artificial"
  deadline_ART50_4:
    it: "Dichiarare i deep fake come contenuti artificiali"
    en: "Disclosing deep fakes as artificial content"
  deadline_ART5_SOCIAL_SCORING:
    it: "Divieto di punteggio sociale delle persone"
    en: "Ban on social scoring of people"
  deadline_ART5_EMOTION_WORKPLACE:
    it: "Divieto di riconoscimento delle emozioni sul lavoro e negli istituti di istruzione"
    en: "Ban on emotion recognition at work and in education institutions"
  deadline_ART5_NCII:
    it: "Divieto di immagini intime non consensuali"
    en: "Ban on non-consensual intimate images"
  web_print_hint:
    it: "«Stampa / Salva PDF» apre la finestra di stampa del browser: da lì scegli «Salva come PDF». Se sul tuo dispositivo non funziona, usa «Scarica il report»: salva un file di testo con gli stessi verdetti e citazioni, nell'ordine standard del report, con gli identificativi delle regole al posto dei titoli e senza legenda e testi di aiuto; le regole «non ancora applicabili» vi compaiono come «NON DETERMINABILE», con la data nella sezione finale."
    en: "'Print / Save as PDF' opens your browser's print dialog: choose 'Save as PDF' there. If that does not work on your device, use 'Download the report': it saves a text file with the same verdicts and citations, in the report's standard order, with rule identifiers instead of titles and without the legend and help texts; rules 'not yet applicable' appear there as 'UNDETERMINED', with the date in the final section."
  web_download:
    it: "Scarica il report (testo)"
    en: "Download the report (text)"
  web_legend_title:
    it: "Cosa significano i risultati?"
    en: "What do the results mean?"
  legend_COMPLIANT:
    it: "CONFORME: con le risposte date, gli obblighi di questa regola risultano rispettati."
    en: "COMPLIANT: given your answers, the obligations of this rule appear to be met."
  legend_NON_COMPLIANT:
    it: "NON CONFORME: con le risposte date manca qualcosa che la legge richiede; la scheda dice cosa."
    en: "NON-COMPLIANT: given your answers, something the law requires is missing; the card says what."
  legend_UNDETERMINED:
    it: "NON DETERMINABILE: mancano informazioni e lo strumento non indovina mai. Completa le risposte indicate, oppure serve una verifica umana o legale."
    en: "UNDETERMINED: information is missing and the tool never guesses. Complete the listed answers, or seek human/legal review."
  legend_NOT_APPLICABLE:
    it: "NON APPLICABILE: questa regola non riguarda il tuo caso."
    en: "NOT APPLICABLE: this rule does not apply to your case."
  web_missing_info:
    it: "Risposte mancanti (rispondendo si può determinare l'esito):"
    en: "Missing answers (answering them can determine the outcome):"
  web_rule_help_label:
    it: "Cosa vuol dire in pratica?"
    en: "What does this mean in practice?"
  rule_help_HR_ANNEX_III:
    it: "Per un uso ad alto rischio la legge chiede, tra l'altro: gestione dei rischi, dati di qualità, documentazione tecnica, registrazione automatica degli eventi, istruzioni chiare a chi lo usa, sorveglianza umana, accuratezza e sicurezza informatica (artt. 8-15), più obblighi che dipendono dal ruolo (fornitore o utilizzatore, artt. 16-27). Se questi obblighi non ti dicono niente, è il caso di parlarne con un consulente. Se la regola non è ancora applicabile, la data compare nella sezione «Prossime scadenze»."
    en: "For a high-risk use the law requires, among other things: risk management, data quality, technical documentation, automatic event logging, clear instructions for users, human oversight, accuracy and cybersecurity (Arts. 8-15), plus role-dependent obligations (provider or deployer, Arts. 16-27). If these obligations mean nothing to you, talk to a professional. If the rule is not yet applicable, the date appears in the 'Upcoming deadlines' section."
  rule_help_ART50_1:
    it: "Chi interagisce con il tuo sistema (per esempio un chatbot sul sito) deve poter capire che sta parlando con un'IA: va detto in modo chiaro, al più tardi alla prima interazione (art. 50(1))."
    en: "People interacting with your system (for example a website chatbot) must be able to tell they are talking to an AI: say it clearly, at the latest at the first interaction (Art. 50(1))."
  rule_help_ART50_2:
    it: "I contenuti generati dall'IA (testo, audio, immagini, video) vanno marcati come artificiali in un formato leggibile dalle macchine, per esempio nei metadati del file (art. 50(2))."
    en: "AI-generated content (text, audio, images, video) must be marked as artificial in a machine-readable format, for example in the file's metadata (Art. 50(2))."
  rule_help_ART50_4:
    it: "Se il tuo sistema genera o manipola deep fake (immagini, audio o video realistici), chi lo usa deve dichiarare che quel contenuto è artificiale (art. 50(4)). L'obbligo nasce dal sistema che li produce, non solo dal pubblicarli."
    en: "If your system generates or manipulates deep fakes (realistic images, audio or video), whoever deploys it must disclose that the content is artificial (Art. 50(4)). The duty arises from the system producing them, not only from publishing."
  rule_help_ART5_SOCIAL_SCORING:
    it: "Usare l'IA per dare un punteggio alle persone in base a comportamento o caratteristiche, con effetti sfavorevoli in contesti che non c'entrano, è una pratica vietata del tutto: non c'è modo di renderla conforme (art. 5(1)(c))."
    en: "Using AI to score people based on behaviour or characteristics, with unfavourable effects in unrelated contexts, is an outright prohibited practice: there is no way to make it compliant (Art. 5(1)(c))."
  rule_help_ART5_EMOTION_WORKPLACE:
    it: "Usare l'IA per riconoscere le emozioni di dipendenti o studenti è vietato, con la sola eccezione di scopi medici o di sicurezza (art. 5(1)(f))."
    en: "Using AI to infer the emotions of employees or students is prohibited, with the sole exception of medical or safety purposes (Art. 5(1)(f))."
  # --- Tier A/B after the persona test (2026-09-02) ----------------------
  # Helpers for the dependent questions (the "gate = No -> Non so ->
  # UNDETERMINED" chain), summary block, INACTIVE legend row, deadlines
  # section retitled and moved below the cards, prohibition banner.
  help_interacts_with_persons:
    it: "La legge parla di sistemi «destinati a interagire direttamente con le persone fisiche» (art. 50, paragrafo 1) senza definire l'espressione. Di regola vi rientra un sistema con cui una persona parla o scrive e da cui riceve risposte: un chatbot, un assistente vocale, un avatar. Un sistema che lavora solo dietro le quinte (per esempio un filtro antispam o un'analisi di dati) di regola no. Se il tuo caso è dubbio, «Non so»."
    en: "The law speaks of systems 'intended to interact directly with natural persons' (Art. 50(1)) without defining the phrase. As a rule it covers a system a person talks or writes to and gets replies from: a chatbot, a voice assistant, an avatar. A system that only works behind the scenes (for example a spam filter or a data analysis) normally does not. If your case is unclear, 'I don't know'."
  help_deepfake_published:
    it: "Un deep fake è un'immagine, un audio o un video generato o manipolato dall'IA che somiglia a persone, oggetti, luoghi, entità o eventi esistenti e apparirebbe falsamente autentico o veritiero (art. 3, punto 60): contano quindi anche prodotti, marchi, aziende o documenti reali, non solo i volti. Anche un ritocco realistico di un volto reale può rientrare nella definizione. Se il sistema non produce nulla del genere, rispondi No; se non sei sicuro, «Non so»."
    en: "A deep fake is AI-generated or manipulated image, audio or video content that resembles existing persons, objects, places, entities or events and would falsely appear authentic or truthful (Art. 3, point 60): real products, brands, companies or documents count too, not only faces. A realistic retouch of a real face may fall under the definition. If the system produces nothing of the kind, answer No; if unsure, 'I don't know'."
  help_deepfake_disclosed:
    it: "Questa domanda ha senso solo se alla precedente (sui deep fake) hai risposto Sì. Se il sistema non genera né manipola deep fake, rispondi No: per questa regola non c'è nulla da dichiarare e il risultato sarà corretto. Attenzione: l'art. 50, paragrafo 4, secondo comma, prevede un obbligo distinto per i testi generati dall'IA e pubblicati per informare il pubblico su questioni di interesse pubblico; questa verifica non lo copre."
    en: "This question only matters if you answered Yes to the previous one (on deep fakes). If the system neither generates nor manipulates deep fakes, answer No: for this rule there is nothing to disclose and the result will be correct. Note: Art. 50(4), second subparagraph, sets a separate duty for AI-generated text published to inform the public on matters of public interest; this check does not cover it."
  help_generates_synthetic_content:
    it: "Conta il contenuto sintetico di tipo audio, immagine, video o testo prodotto dal sistema (art. 50, paragrafo 2): anche il testo, per esempio le risposte scritte di un chatbot. Se il sistema non produce contenuti (per esempio classifica o calcola soltanto), rispondi No. La legge esclude i sistemi che svolgono solo una funzione assistiva di editing standard o non modificano in modo sostanziale i dati di ingresso (per esempio un correttore ortografico): questa verifica non valuta l'esclusione, quindi in quel caso rispondi «Non so»."
    en: "What counts is synthetic audio, image, video or text content produced by the system (Art. 50(2)): text included, for example a chatbot's written replies. If the system produces no content (for example it only classifies or computes), answer No. The law exempts systems that only perform an assistive function for standard editing or do not substantially alter the input (for example a spell checker): this check does not assess that exemption, so in that case answer 'I don't know'."
  help_content_marked_machine_readable:
    it: "Significa che il contenuto porta un contrassegno tecnico (per esempio nei metadati o in filigrana) che permette a un software di riconoscerlo come artificiale (art. 50, paragrafo 2). Questo obbligo è del fornitore del sistema: se usi uno strumento altrui, non devi saperlo tu. Chiedi al fornitore per iscritto e, finché non risponde, scegli «Non so»."
    en: "It means the content carries a technical mark (for example in metadata or a watermark) that lets software recognise it as artificial (Art. 50(2)). This duty belongs to the system's provider: if you use someone else's tool, you are not expected to know. Ask the provider in writing and, until they answer, choose 'I don't know'."
  help_practice_social_scoring:
    it: "Il punteggio sociale è valutare le persone, per un certo periodo di tempo, in base al loro comportamento sociale o alle loro caratteristiche personali, e usare quel punteggio per trattarle peggio in un contesto che non c'entra, o in modo sproporzionato (art. 5, paragrafo 1, lettera c). Secondo le linee guida della Commissione (C(2025) 5052, punti 175-177), un punteggio di credito basato su dati finanziari pertinenti, o vantaggi proporzionati a chi ha uno storico di acquisti affidabile, normalmente non lo sono. Se non sei sicuro, «Non so»."
    en: "Social scoring means evaluating people, over a certain period of time, on their social behaviour or personal characteristics and using that score to treat them worse in an unrelated context, or disproportionately (Art. 5(1)(c)). Under the Commission's guidelines (C(2025) 5052, paras 175-177), a credit score based on relevant financial data, or proportionate advantages for customers with a reliable purchase history, normally are not. If unsure, 'I don't know'."
  help_emotion_recognition_workplace:
    it: "Conta un sistema che, da dati biometrici (per esempio il volto dalla webcam o la voce), identifica o deduce emozioni o intenzioni di dipendenti, candidati o studenti, per esempio stress, noia o interesse (art. 5, paragrafo 1, lettera f; art. 3, punto 39). Secondo le linee guida della Commissione (C(2025) 5052, punti 254-255), vale anche in fase di selezione del personale, e dedurre interesse e attenzione degli studenti è vietato. Non contano il rilevamento di stati fisici (stanchezza, dolore), il semplice riconoscimento di un'espressione evidente (considerando 18) né, per esempio, un tracciamento dello sguardo che non deduce emozioni. Se un fornitore te lo propone e non l'hai ancora attivato, rispondi pensando all'uso previsto."
    en: "What counts is a system that, from biometric data (for example the face on a webcam or the voice), identifies or infers emotions or intentions of employees, candidates or students, for example stress, boredom or interest (Art. 5(1)(f); Art. 3, point 39). Under the Commission's guidelines (C(2025) 5052, paras 254-255), this also applies during recruitment, and inferring students' interest and attention is prohibited. Detecting physical states (fatigue, pain), merely recognising an obvious expression (Recital 18) or, for example, gaze tracking that infers no emotion does not count. If a vendor is proposing such a system and you have not switched it on yet, answer for the intended use."
  help_emotion_medical_safety_exception:
    it: "Questa domanda ha senso solo se alla precedente (sul riconoscimento delle emozioni) hai risposto Sì. L'eccezione è stretta (art. 5, paragrafo 1, lettera f; linee guida della Commissione C(2025) 5052, punti 256-263): «medico» significa dispositivi medici con marcatura CE a scopo terapeutico; «sicurezza» significa solo protezione della vita e della salute, per esempio rilevare stress o cali di concentrazione in chi usa macchinari o sostanze pericolose. Non rientrano il monitoraggio del benessere, dello stress o del burnout, né la valutazione delle prestazioni. Nota: rilevare la stanchezza (per esempio il colpo di sonno di un autista) non è riconoscimento delle emozioni, quindi non è vietato in partenza (considerando 18). Se non sei sicuro che il tuo caso rientri nell'eccezione, rispondi No o «Non so». Se alla domanda precedente hai risposto No, rispondi No anche qui."
    en: "This question only matters if you answered Yes to the previous one (on emotion recognition). The exception is narrow (Art. 5(1)(f); Commission guidelines C(2025) 5052, paras 256-263): 'medical' means CE-marked medical devices for therapeutic use; 'safety' means only the protection of life and health, for example detecting stress or loss of concentration in people operating dangerous machines or chemicals. Monitoring wellbeing, stress or burnout, or assessing performance, is not covered. Note: detecting fatigue (for example a driver falling asleep) is not emotion recognition, so it is not prohibited in the first place (Recital 18). If unsure that your case falls under the exception, answer No or 'I don't know'. If you answered No to the previous question, answer No here too."
  help_ncii_safeguards_state_of_art:
    it: "Questa domanda ha senso solo se alla precedente (sulla capacità di produrre quel materiale) hai risposto Sì. La legge (art. 5, paragrafo 1 bis, lettera a, punto ii, introdotto dal Reg. (UE) 2026/1744) chiede misure tecniche di sicurezza e altre salvaguardie ragionevoli e adeguate che impediscano in modo affidabile quella produzione, tenendo conto degli usi impropri prevedibili, e che correggano gli abusi osservati o segnalati: per esempio filtri sui prompt e sulle immagini più una procedura di segnalazione. Le conosce il fornitore: chiediglielo per iscritto e, finché non risponde, «Non so». Questa verifica semplifica il test di legge in «salvaguardie allo stato dell'arte: sì/no» e non distingue il caso dell'utilizzatore, per cui la legge vieta l'uso solo se è fatto a quello scopo (lettera b). Se il sistema non può produrre quel materiale, rispondi No: non c'è nulla da salvaguardare e il risultato sarà corretto."
    en: "This question only matters if you answered Yes to the previous one (on the capability to produce such material). The law (Art. 5(1a)(a)(ii), inserted by Reg. (EU) 2026/1744) requires reasonable and adequate technical safety measures and other safeguards that reliably prevent that generation, taking reasonably foreseeable misuse into account, and that correct observed or reported misuse: for example prompt and image filters plus a reporting procedure. The provider knows them: ask in writing and, until they answer, 'I don't know'. This check simplifies the legal test into 'state-of-the-art safeguards: yes/no' and does not distinguish the deployer's case, where the law prohibits use only if done for that purpose (point (b)). If the system cannot produce such material, answer No: there is nothing to safeguard and the result will be correct."
  help_ncii_intended_purpose:
    it: "Questa domanda ha senso solo se il sistema può produrre quel materiale. «Finalità prevista» è lo scopo per cui il sistema è progettato o usato (art. 5, paragrafo 1 bis, lettera a, punto i, e lettera b, introdotti dal Reg. (UE) 2026/1744). Se hai risposto No due domande fa (sulla capacità), rispondi No anche qui."
    en: "This question only matters if the system can produce such material. 'Intended purpose' is what the system is designed or used for (Art. 5(1a)(a)(i) and (b), inserted by Reg. (EU) 2026/1744). If you answered No two questions ago (on the capability), answer No here too."
