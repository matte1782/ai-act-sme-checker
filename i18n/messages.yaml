    it: "NON ANCORA APPLICABILE: la regola entra in vigore alla data indicata. Non mancano informazioni: oggi non è ancora in vigore; se il tuo caso la riguarda, preparati per quella data."
    en: "NOT YET APPLICABLE: the rule starts to apply on the date shown. No information is missing: it is simply not in force yet; if it concerns you, prepare for that date."
