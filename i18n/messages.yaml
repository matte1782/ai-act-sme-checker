  web_next_steps:
    it: "Cosa fare adesso: 1) parti dalle schede con l'etichetta rossa «NON CONFORME»: dicono cosa manca e cosa fare; 2) per le schede con l'etichetta gialla e «Risposte mancanti», rispondi (se lo sa il tuo fornitore, chiediglielo per iscritto); 3) le regole «non ancora applicabili» entrano in vigore alla data indicata: se ti riguardano, usa il tempo per prepararti. Questo riepilogo non sostituisce un parere professionale."
    en: "What to do now: 1) start from the cards with the red 'NON-COMPLIANT' label: they say what is missing and what to do; 2) for cards with the yellow label and 'Missing answers', answer them (if your provider knows, ask in writing); 3) rules 'not yet applicable' start on the date shown: if they concern you, use the time to prepare. This summary is not a substitute for professional advice."
